<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SplitSnap</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3eee2;--card:#fffdf7;--ink:#1d1b17;--mute:#7b7566;--line:#ddd5c2;--hot:#d63f27;--ok:#2f7d4f;--flag:#fff0b8;
--sans:'Bricolage Grotesque',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
h1{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:0}h1 b{color:var(--hot)}
.tag{font:12px var(--mono);color:var(--mute)}
.mono,input.n,.amt{font-family:var(--mono)}
.drop{display:block;border:2px dashed var(--ink);border-radius:14px;padding:26px;text-align:center;cursor:pointer;background:var(--card);margin-bottom:18px}
.drop{box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}.drop:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--hot)}
.drop.on{background:var(--flag);box-shadow:7px 7px 0 var(--hot)}.drop .pri{padding:12px 24px;font-size:16px;background:var(--hot);border-color:var(--ink);color:#fff;margin:0 6px 6px 0}.drop b{font-size:20px}.drop p{margin:6px 0 0;color:var(--mute)}
button{font:600 14px var(--sans);border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
button.pri{background:var(--ink);color:var(--paper)}button:hover{transform:translateY(-1px)}
button.x{border:0;background:none;padding:2px 6px;color:var(--mute)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--mute)}
.receipt{background:var(--card);border:1.5px solid var(--ink);border-radius:4px 4px 0 0;padding:16px 16px 22px;position:relative;
-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 54px 92px 26px;gap:6px;align-items:center;padding:7px 0 3px}
.row.c{grid-template-columns:1fr 100px 26px}
input{font:inherit;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 2px;width:100%;color:var(--ink);min-width:0}
input:focus{outline:0;border-bottom:1.5px solid var(--hot)}input.n{text-align:right}
.flag{background:var(--flag);border-radius:4px}.flag::after{content:""}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 8px;border-bottom:1px solid var(--line)}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;background:none;user-select:none}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.chip.all{border-style:dashed;color:var(--mute)}
.sub{font:12px var(--mono);color:var(--mute);margin:12px 0 2px}
.tot{display:flex;justify-content:space-between;align-items:center;font-weight:600;padding-top:10px}
.warn{background:var(--flag);border-left:4px solid var(--hot);padding:8px 12px;border-radius:6px;font-size:13px;margin:0 0 8px}
.person{border-top:1px solid var(--line);padding:12px 0}.person:first-of-type{border:0}
.ph{display:flex;justify-content:space-between;align-items:baseline}.ph b{font-size:18px}
.amt{font-size:24px;font-weight:500}.amt.adj{color:var(--hot)}
.badge{font:11px var(--mono);background:var(--hot);color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px}
details summary{cursor:pointer;color:var(--mute);font-size:13px;margin-top:4px}
pre{white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--paper);padding:10px;border-radius:8px;margin:6px 0}
.sticky{position:sticky;top:12px}@media(max-width:820px){.sticky{position:static}}
.pill{display:inline-flex;align-items:center;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:2px 4px 2px 12px;margin:0 6px 6px 0}
.ov{display:flex;gap:6px;margin-top:6px}.ov input{border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.settle{font:13px var(--mono);padding:3px 0}.muted{color:var(--mute)}.hide{display:none}
select{font:inherit;padding:5px;border-radius:8px;border:1.5px solid var(--ink);background:var(--card)}
</style></head><body><div class="wrap">
<header><h1>Split<b>Snap</b></h1><span class="tag" id="mode"></span></header>

<label class="drop" id="drop"><input type="file" id="file" accept="image/*" capture="environment" class="hide">
<b>Snap or drop a bill photo</b><p style="margin:14px 0 6px"><button type="button" class="pri" id="pick">📷 Upload bill photo</button><button type="button" id="demo">try the sample bill</button></p><p style="margin:0;font-size:13px">Lay it flat, good light, whole bill in frame</p></label>
<div id="status" class="muted" style="margin:0 0 14px"></div>

<div class="grid" id="app" style="display:none">
<div>
  <div class="card"><h2>1 · Who's eating</h2><div id="party"></div>
    <input id="newp" placeholder="Add a name and press Enter" style="margin-top:4px"></div>
  <div id="warns"></div>
  <div class="receipt"><h2 class="sub" style="margin:0 0 4px">2 · CHECK THE BILL · 3 · TAP WHO SHARED EACH ITEM</h2>
    <div id="items"></div><button id="addi" class="x">+ item</button>
    <div class="sub">CHARGES &amp; TAXES</div><div id="charges"></div><button id="addc" class="x">+ charge</button>
    <div class="tot"><span>Printed total</span><input class="n" id="stated" style="width:110px" inputmode="decimal"></div></div>
</div>
<div class="sticky">
  <div class="card"><h2>Who pays what</h2><div id="sum" class="mono muted" style="font-size:12px;margin-bottom:8px"></div>
    <div id="people"><span class="muted">Add people and tap items to see the split.</span></div>
    <div id="unas"></div></div>
  <div class="card" id="settle" style="display:none"><h2>Settle up</h2>
    <select id="payer"></select> <span class="muted">paid the bill</span><div id="xfers" style="margin-top:8px"></div>
    <button id="copy" style="margin-top:8px">Copy for WhatsApp</button></div>
  <details class="card"><summary>Why these numbers?</summary><pre id="why"></pre></details>
</div></div></div>

<script>
const $=s=>document.querySelector(s),S={manual:new Set(),bill:null,party:[],assign:{},ov:[],flags:new Set(),paid:'',res:null};
const inr=n=>(n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const x=parseFloat(String(v).replace(/[₹,\s]/g,''));return isNaN(x)?0:x};
let nid=0,tm,seq=0;
fetch('/api/health').then(r=>r.json()).then(h=>$('#mode').textContent=h.extractor==='mock'?'demo mode · no model attached':'model: '+h.extractor);

async function api(url,opt){const r=await fetch(url,opt),j=await r.json();if(!r.ok)throw new Error(j.error||j.detail||r.statusText);return j}
function load(j,sample){S.bill=j.bill;S.assign={};S.manual=new Set();S.ov=[];S.paid='';
  S.flags=new Set(j.flags.map(f=>f.id+'.'+(f.field==='unit_price'?'total':f.field)));
  if(sample)S.party=['Riya','Aman','Kabir'],S.assign={i0:{Riya:1},i1:{Riya:1,Aman:1,Kabir:1},i2:{Aman:1},i3:{Kabir:1}};
  $('#app').style.display='grid';$('#status').textContent=j.flags.length?`${j.flags.length} field(s) the model wasn't sure about are highlighted. Please check them.`:'';
  $('#warns').innerHTML=(j.retake?'<p class="warn" style="border-color:#b00"><b>'+(j.bill.items.length?'The model is unsure about '+j.uncertain+' of '+j.fields+' fields.':'The model could not read any items.')+'</b> Check every highlighted field against your bill, or retake the photo larger, flat and in good light. <button class="x" onclick="$(\'#file\').click()">Retake</button></p>':'')+j.warnings.map(w=>`<p class="warn">${esc(w)}</p>`).join('');
  $('#stated').value=S.bill.stated_total??'';drawAll();recalc()}
async function scan(file){const t0=Date.now(),iv=setInterval(()=>$('#status').textContent=`Reading your bill… ${Math.round((Date.now()-t0)/1000)}s`,500);
  try{const fd=new FormData();if(file)fd.append('image',file);load(await (file?api('/api/extract',{method:'POST',body:fd}):api('/api/sample')),!file&&!S.party.length)}
  catch(e){$('#status').textContent='Could not read the bill: '+e.message}finally{clearInterval(iv)}}
$('#file').onchange=e=>e.target.files[0]&&scan(e.target.files[0]);$('#pick').onclick=e=>{e.preventDefault();$('#file').click()};$('#demo').onclick=e=>{e.preventDefault();scan(null)};
['dragover','dragleave','drop'].forEach(t=>$('#drop').addEventListener(t,e=>{e.preventDefault();$('#drop').classList.toggle('on',t==='dragover');
  if(t==='drop'&&e.dataTransfer.files[0])scan(e.dataTransfer.files[0])}));

function fl(id,f){return S.flags.has(id+'.'+f)?' flag':''}
function drawAll(){drawParty();drawItems();drawCharges()}
function drawParty(){$('#party').innerHTML=S.party.map(p=>`<span class="pill">${esc(p)}<button class="x" data-rm="${esc(p)}">✕</button></span>`).join('')||'<span class="muted">Nobody yet</span>';
  $('#payer').innerHTML='<option value="">Who paid?</option>'+S.party.map(p=>`<option ${p===S.paid?'selected':''}>${esc(p)}</option>`).join('')}
function chips(it){const m=S.assign[it.id]||{},mx=Math.max(1,Math.floor(it.qty||1));
  return S.party.map(p=>`<span class="chip${m[p]?' on':''}" data-i="${it.id}" data-p="${esc(p)}">${esc(p)}${m[p]>1?' ×'+m[p]:''}</span>`).join('')
  +(S.party.length?`<span class="chip all" data-all="${it.id}">everyone</span>`:'')+(S.manual.has(it.id)?'<span class="badge">MANUAL</span>':'')+(mx>1?`<span class="muted" style="font-size:12px;align-self:center">${mx} portions: tap a name again for more</span>`:'')}
function drawItems(){$('#items').innerHTML=S.bill.items.map(it=>`<div data-r="${it.id}"><div class="row">
  <input data-k="name" value="${esc(it.name)}" class="${fl(it.id,'name')}"><input class="n${fl(it.id,'qty')}" data-k="qty" value="${it.qty}" inputmode="decimal">
  <input class="n${fl(it.id,'total')}" data-k="total" value="${it.total}" inputmode="decimal"><button class="x" data-del="${it.id}">✕</button></div>
  <div class="chips">${chips(it)}</div></div>`).join('')}
function drawCharges(){$('#charges').innerHTML=S.bill.charges.map(c=>`<div class="row c" data-c="${c.id}"><input data-k="type" value="${esc(c.type)}" class="${fl(c.id,'type')}">
  <input class="n${fl(c.id,'amount')}" data-k="amount" value="${c.amount}" inputmode="decimal"><button class="x" data-delc="${c.id}">✕</button></div>`).join('')}

document.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.rm){const p=t.dataset.rm;S.party=S.party.filter(x=>x!==p);S.ov=S.ov.filter(o=>o.name!==p);
    Object.values(S.assign).forEach(m=>delete m[p]);if(S.paid===p)S.paid='';drawAll();recalc()}
  else if(t.dataset.p){const it=S.bill.items.find(x=>x.id===t.dataset.i),m=S.assign[it.id]??={},mx=Math.max(1,Math.floor(it.qty||1)),w=((m[t.dataset.p]||0)+1);
    w>mx?delete m[t.dataset.p]:m[t.dataset.p]=w;if(S.res)S.manual.add(it.id);t.closest('.chips').innerHTML=chips(it);recalc()}
  else if(t.dataset.all){const m=S.assign[t.dataset.all]={};S.party.forEach(p=>m[p]=1);if(S.res)S.manual.add(t.dataset.all);t.closest('.chips').innerHTML=chips(S.bill.items.find(x=>x.id===t.dataset.all));recalc()}
  else if(t.dataset.del){S.bill.items=S.bill.items.filter(x=>x.id!==t.dataset.del);drawItems();recalc()}
  else if(t.dataset.delc){S.bill.charges=S.bill.charges.filter(x=>x.id!==t.dataset.delc);drawCharges();recalc()}
  else if(t.dataset.ov){const w=t.closest('.person'),v=w.querySelector('input').value;if(v!==''){S.ov.push({name:t.dataset.ov,total:num(v),reason:w.querySelectorAll('input')[1].value});recalc()}}
  else if(t.dataset.reset){S.ov=[];recalc()}});
$('#addi').onclick=()=>{S.bill.items.push({id:'n'+ ++nid,name:'New item',qty:1,unit_price:0,total:0});drawItems();recalc()};
$('#addc').onclick=()=>{S.bill.charges.push({id:'m'+ ++nid,type:'Service Charge',amount:0,basis:'proportional'});drawCharges();recalc()};
$('#newp').onkeydown=e=>{const v=e.target.value.trim();if(e.key==='Enter'&&v){if(S.party.some(p=>p.toLowerCase()===v.toLowerCase()))return;S.party.push(v);e.target.value='';drawAll();recalc()}};
$('#payer').onchange=e=>{S.paid=e.target.value;recalc()};
$('#stated').oninput=e=>{S.bill.stated_total=e.target.value===''?null:num(e.target.value);recalc()};
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;
  const row=t.closest('[data-r]'),crow=t.closest('[data-c]'),o=row?S.bill.items.find(x=>x.id===row.dataset.r):crow&&S.bill.charges.find(x=>x.id===crow.dataset.c);
  if(!o)return;o[k]=['name','type'].includes(k)?t.value:num(t.value);t.classList.remove('flag');
  if(row&&k==='qty'){o.unit_price=o.qty?o.total/o.qty:0}if(row&&k==='total'){o.unit_price=o.qty?o.total/o.qty:0}recalc()});

function recalc(){clearTimeout(tm);tm=setTimeout(run,250)}
async function run(){const my=++seq;if(!S.party.length||!S.bill.items.length)return;
  try{const j=await api('/api/split',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bill:S.bill,party:S.party,assignments:S.assign,overrides:S.ov,paid_by:S.paid||null,manual_items:[...S.manual]})});
    if(my===seq){S.res=j;show(j)}}catch(e){$('#people').innerHTML=`<p class="warn">${esc(e.message)}</p>`}}
function show(j){const r=j.result;$('#sum').textContent=r.summary.line;
  $('#people').innerHTML=Object.values(r.people).map(p=>`<div class="person"><div class="ph"><b>${esc(p.name)}${p.adjustment?'<span class="badge">ADJUSTED</span>':''}</b>
   <span class="amt${p.adjustment?' adj':''}">${inr(p.total)}</span></div>
   <div class="muted" style="font-size:13px">${p.lines.length?p.lines.map(l=>esc(l.name)+(l.shared_with.length?' ('+(1+l.shared_with.length)+' ways)':'')).join(' · '):'No items yet'}</div>
   <div class="mono muted" style="font-size:12px;margin-top:3px">Items ${inr(p.items_subtotal)}${p.charges.filter(c=>c.amount).map(c=>' · '+esc(c.type)+' '+inr(c.amount)).join('')}${p.adjustment?(p.adjustment.type==='override'?` · <b style="color:var(--hot)">MANUAL ADJUSTMENT: calculated ${inr(p.adjustment.original_total)}${p.adjustment.reason?', '+esc(p.adjustment.reason):''}</b>`:` · <b style="color:var(--hot)">ADJUSTED ${inr(Math.abs(p.adjustment.delta))} ${p.adjustment.delta<0?'less':'more'} because ${esc(p.adjustment.caused_by||'someone')}'s amount was set by hand (calculated ${inr(p.adjustment.original_total)})</b>`):''}</div>
   <details><summary>How is this worked out?</summary><pre>${esc(j.explain[p.name])}</pre>
   <div class="ov"><input class="mono" placeholder="Set amount ₹" inputmode="decimal"><input placeholder="Reason (optional)"><button data-ov="${esc(p.name)}">Set</button></div></details></div>`).join('')
   +(S.ov.length?'<button data-reset="1" class="x" style="margin-top:6px">↺ undo manual changes</button>':'');
  const u=r.unassigned;$('#unas').innerHTML=u?`<p class="warn">Not assigned yet: ${esc(u.items.join(', '))} (${inr(u.total)} with charges). Nobody pays for it until it's claimed.</p>`:'';
  $('#why').textContent=j.bill_text;$('#settle').style.display='block';
  $('#xfers').innerHTML=!S.paid?'<span class="muted">Pick who paid to see who owes whom.</span>':(j.settle||[]).map(t=>`<div class="settle">${esc(t.from)} → ${esc(t.to)} <b>${inr(t.amount)}</b></div>`).join('')||'<span class="muted">Nothing to settle.</span>'}
$('#copy').onclick=()=>{if(!S.res)return;const r=S.res.result,t='SplitSnap 🧾\n'+Object.values(r.people).map(p=>`${p.name}: ${inr(p.total)}${p.adjustment?' (manual adjustment'+(p.adjustment.type==='override'?'':' caused by '+(p.adjustment.caused_by||'an override'))+', calculated '+inr(p.adjustment.original_total)+')':''}`).join('\n')
  +(S.paid&&S.res.settle?.length?'\n\n'+S.res.settle.map(x=>`${x.from} pays ${x.to} ${inr(x.amount)}`).join('\n'):'');navigator.clipboard.writeText(t);$('#copy').textContent='Copied ✓'};
</script></body></html>
